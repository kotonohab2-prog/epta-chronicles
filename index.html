<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101a2a">
<title>EPTA CHRONICLES - Playable Prototype</title>
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/battle-v09.css">
<link rel="stylesheet" href="css/status-v10.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="sigil">✧</span><div><b>EPTA CHRONICLES</b><small>SEVEN CONTINENTS · PROTOTYPE 0.9</small></div></div>
    <div class="resources"><span>冒険者 <b>Lv.1</b></span><span>✧ <b id="gems">1,000</b></span><span>コイン <b id="coins">5,000</b></span></div>
    <button class="gear" data-view="settings" aria-label="設定">⚙</button>
  </header>
  <div class="layout">
    <nav class="nav">
      <button class="navbtn selected" data-view="home"><i>⌂</i>ホーム</button>
      <button class="navbtn" data-view="battle"><i>⚔</i>冒険・バトル</button>
      <button class="navbtn" data-view="party"><i>♟</i>キャラクター</button>
      <button class="navbtn" data-view="gacha"><i>✧</i>召喚</button>
      <button class="navbtn" data-view="records"><i>☆</i>実績・称号</button>
　　　<button class="navbtn" data-view="shop"><i>◇</i>石ショップ</button>
    </nav>
    <main id="screen" class="screen" aria-live="polite"></main>
  </div>
  <footer><span>EPTA PROJECT</span><span>ブラウザ試作版 · データはこの端末に保存</span></footer>
</div>
<div id="modal-root"></div>
<div id="toast" class="toast" role="status"></div>
<script src="js/game.js"></script>
<script src="js/battle-v09.js"></script>
<script src="js/status-v10.js"></script>
<script src="js/class-v11.js"></script>
<link rel="stylesheet" href="css/formation-v12.css">
<link rel="stylesheet" href="css/formation-tap-v13.css">
<link rel="stylesheet" href="css/battle-quick-swap-v14.css">
<link rel="stylesheet" href="css/battle-fix-v15.css">
<link rel="stylesheet" href="css/battle-header-swap-v16.css">
<link rel="stylesheet" href="css/battle-header-swap-v17.css">
<script src="js/formation-v12.js"></script>
<script src="js/formation-tap-v13.js"></script>
<script src="js/battle-quick-swap-v14.js"></script>
<script src="js/battle-fix-v15.js"></script>
<script src="js/battle-header-swap-v16.js"></script>
<script src="js/battle-header-swap-v17.js"></script>
</body>
</html>
